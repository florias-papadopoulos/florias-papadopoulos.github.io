# Deploys audience mode's Cloudflare Worker (tools/workers/live) whenever its files change on master, or by hand from
# the Actions tab. Needs the repository secret CLOUDFLARE_API_TOKEN (a Cloudflare token that may only edit Workers, for
# this one account) in the environment "cloudflare". The presenter key is set once in the Cloudflare dashboard and is
# never touched by this workflow.
name: Deploy audience mode worker

on:
  push:
    branches: ["master"]
    paths: ["tools/workers/live/**", ".github/workflows/live-worker.yml"]
  workflow_dispatch:

# the GITHUB_TOKEN can do nothing; this job only needs to read the code
permissions:
  contents: read

concurrency:
  group: "live-worker"
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: tools/workers/live

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # the token lives in this environment; in Settings > Environments it is limited to the master branch
    environment: cloudflare
    env:
      # exact wrangler version (change on purpose, together with package.json)
      WRANGLER_VERSION: 4.153.0
    steps:
      # actions pinned to the exact commit of their release, as in hugo.yml
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with:
          node-version: 22
      - name: Tests
        run: node test/run.js
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes "wrangler@${WRANGLER_VERSION}" deploy
