# Sample workflow for building and deploying a Hugo site to GitHub Pages
name: Deploy Hugo site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# The GITHUB_TOKEN can do nothing by default; each job gets only what it needs (only deploy can publish)
permissions: {}

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      HUGO_VERSION: 0.169.0
      # SHA-256 of hugo_extended_0.169.0_linux-amd64.deb, written here (from the release's checksum list) so a release
      # replaced later on GitHub cannot slip in a different program; change it together with HUGO_VERSION
      HUGO_SHA256: a20f7da84e0981bebbecc032cc87f0dda2049a844727720aab14e61ce416e5e9
    steps:
      - name: Install Hugo CLI
        working-directory: ${{ runner.temp }}
        run: |
          deb=hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          wget -q "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/$deb"
          echo "${HUGO_SHA256}  $deb" | sha256sum --check --strict -
          sudo dpkg -i "$deb"
      # every action is pinned to the exact commit of its release (a tag can be moved, a commit cannot); the version
      # is in the comment, update both together
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
        with:
          submodules: recursive
          persist-credentials: false
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d   # v6.0.0
      - name: Install Node.js dependencies
        run: "[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true"
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9   # v5.0.0
        with:
          path: ./public

  # Deployment job
  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346   # v5.0.1
        with:
          # GitHub Pages sometimes takes more than the default 10 minutes to publish: wait up to 30 (milliseconds)
          timeout: 1800000
