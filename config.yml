baseURL: "https://florias-papadopoulos.github.io/"
title: Florias Papadopoulos
theme: PaperMod
locale: en

enableRobotsTXT: true
disablePathToLower: true
pagination:
  pagerSize: 20

# Project pages and their files stay in _pages/projects (old URLs and GitHub links keep working):
# the .md files become pages under /projects/, everything else is served at /_pages/projects/.
module:
  mounts:
    - source: content
      target: content
    - source: _pages/projects
      target: content/projects
      files: ["**/*.md"]
    - source: static
      target: static
    - source: _pages/projects
      target: static/_pages/projects
      files: ["! **/*.md"]
    - source: files
      target: static/files
    # Teaching (the CryptoGames course games, built into teaching/) hidden for now: uncomment this mount and add
    # a "Teaching" menu entry and button with url /teaching/ to publish it
    # - source: teaching
    #   target: static/teaching

menu:
  main:
    - name: Bachelor
      url: /bachelor/
      weight: 1
    - name: Master
      url: /master/
      weight: 1
    - name: Papers
      url: /papers/
      weight: 2
    - name: CV
      url: /files/resume.pdf
      weight: 4

params:
  description: "Florias Papadopoulos, doctoral researcher in cryptography at the University of St. Gallen (HSG)."
  author: Florias Papadopoulos
  DateFormat: January 2006
  defaultTheme: light
  hideFooter: false
  disableThemeToggle: true
  ShowShareButtons: false
  ShowReadingTime: false
  disableSpecial1stPost: true
  disableAnchoredHeadings: true
  ShowPostNavLinks: false
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: true
  ShowAllPagesInArchive: false
  MainSections: [projects]
  ShowToc: false
  disableScrollToTop: true
  TocOpen: true
  ShowWordCount: false
  UseHugoToc: true
  comments: false
  math: false
  profileMode:
    enabled: true
    title: Florias Papadopoulos
    nativeName: Φλωριάς Παπαδόπουλος
    kicker: Doctoral researcher · Applied cryptography
    location: St. Gallen, Switzerland
    badge: CYD Fellow
    badgeUrl: https://www.epfl.ch/research/funding/epfl-programmes/cyd/cyd-phd/
    tagline: My research covers provable security, post-quantum cryptography and privacy-preserving protocols, with a focus on secure, efficient **proximity tracking** and **collision avoidance**.
    interests: [Provable security, Post-quantum cryptography, Privacy-preserving protocols]
    # The route from the first stop to the current one ("now"), an arrow between them.
    # "projects" lists the entries whose context starts with that word in a hover tab ("noun" names them),
    # "url" is the page with all of them.
    journey:
      - stop: gr
        flag: 🇬🇷
        place: Thessaloniki, Greece
        school: Aristotle University of Thessaloniki
        when: then
        items:
          - label: BSc Mathematics
            projects: Bachelor
            url: /bachelor/
          - label: MSc Theoretical Computer Science & Control Theory
            projects: Master
            url: /master/
      - stop: ch
        flag: 🇨🇭
        place: St. Gallen, Switzerland
        school: University of St. Gallen (HSG)
        when: now
        items:
          - label: PhD, Cybersecurity & Applied Cryptography lab (Prof. Katerina Mitrokotsa)
            projects: Paper
            noun: paper
            url: /papers/
    # Latest news on the home page, newest first. date is shown as written, text may use **bold**,
    # url is optional (links starting with http open in a new tab). The list scrolls after three items.
    news:
      - date: "2026"
        text: "New paper at **ACM ASIA CCS 2026**: Privacy-preserving Proximity Testing from Geometric Fuzzy Matching"
        url: https://dl.acm.org/doi/10.1145/3779208.3785374
    # Latest LinkedIn posts on the home page, newest first; nothing is shown while the list is empty ([]).
    # One post at a time with arrows and dots: a card in the right margin on wide screens, next to the news on
    # smaller ones, below it on phones. Each post:
    #   date:  shown as written, e.g. "28 Oct 2026"
    #   text:  a short excerpt (about two sentences), may use **bold**
    #   image: optional, a picture under static/, e.g. img/linkedin/my-post.jpg (shown 16:9, cropped to fill)
    #   alt:   optional, describes the picture (default: the start of the text)
    #   url:   the link to the post (Share > Copy link on LinkedIn)
    # tools/linkedin_post.py URL [URL ...] fetches a public post's text and picture and prints such an entry
    # (--write adds it here). linkedinUrl is the "All posts" link (default: the LinkedIn entry of socialIcons).
    linkedin:
      - date: "Sep 2026"
        text: "Short talk at **Swiss Crypto Day 2026**, ETH Zürich: around 150 people in the room, my biggest audience so far."
        image: img/linkedin/swiss-crypto-day.jpg
        alt: "Giving a talk in a lecture hall at ETH Zürich"
        url: https://www.linkedin.com/posts/florias-papadopoulos-b035ab233_cydfellowship-share-7505560149105856512-eSYg/
      - date: "Sep 2026"
        text: "One summer, four stops: talks on proximity testing in Germany, Switzerland and Italy."
        image: img/linkedin/summer-four-stops.jpg
        alt: "Short talk at the ALPEC 2026 summer school in Trento"
        url: https://www.linkedin.com/posts/florias-papadopoulos-b035ab233_really-enjoyed-all-four-of-these-new-topics-ugcPost-7504106199747923969-pcNe/
      - date: "Jun 2026"
        text: "Presented our paper **Privacy-preserving Proximity Testing from Geometric Fuzzy Matching** at ACM AsiaCCS '26 in Bangalore."
        image: img/linkedin/asiaccs-talk.jpg
        alt: "Presenting the paper at ACM AsiaCCS 2026"
        url: https://www.linkedin.com/posts/florias-papadopoulos-b035ab233_cydfellowship-acmasiaccs2026-asiaccs2026-ugcPost-7469375426713526272-uBmJ/
      - date: "Jun 2026"
        text: "HSG features the focus of my **CYD Fellowship**: privacy-preserving primitives for proximity tracking and collision avoidance."
        image: img/linkedin/hsg-feature.jpg
        alt: "Working on a drone in the lab with colleagues"
        url: https://www.linkedin.com/posts/florias-papadopoulos-b035ab233_cydfellowship-share-7467521422588903424-AMZY/
      - date: "Dec 2025"
        text: "Hosted high school students at HSG: the Enigma machine and a first look at cybersecurity."
        image: img/linkedin/enigma-students.jpg
        alt: "High school students at an Enigma machine session at HSG"
        url: https://www.linkedin.com/posts/florias-papadopoulos-b035ab233_great-to-host-high-school-students-and-see-ugcPost-7406977583768035328-zYWJ/
    linkedinUrl: https://www.linkedin.com/in/florias-papadopoulos-b035ab233
    imageUrl: my_profile_square.jpg
    imageTitle: Florias Papadopoulos
    imageWidth: 168
    imageHeight: 168
    buttons:
      - name: Bachelor
        url: /bachelor/
      - name: Master
        url: /master/
      - name: Papers
        url: /papers/

  socialIcons:
    - name: CV
      url: /files/resume.pdf
    - name: LinkedIn
      url: https://www.linkedin.com/in/florias-papadopoulos-b035ab233
    - name: GitHub
      url: https://github.com/florias-papadopoulos
    - name: Instagram
      url: https://www.instagram.com/florias.pap/

  # "?v=key" makes browsers fetch the new (key) icon instead of a cached old one; bump it when the icon changes
  assets:
    disableScrollBarStyle: true
    favicon: favicon.ico?v=key
    favicon16x16: favicon-16x16.png?v=key
    favicon32x32: favicon-32x32.png?v=key
    apple_touch_icon: apple-touch-icon.png?v=key
    safari_pinned_tab: safari-pinned-tab.svg?v=key
  cover:
    hiddenInList: false
    hiddenInSingle: true
  label:
    text: Florias Papadopoulos
    icon: favicon.ico?v=key
    iconHeight: 18

markup:
  goldmark:
    renderer:
      unsafe: true
    # Leave $...$ and $$...$$ untouched for KaTeX
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [['$$', '$$']]
          inline: [['$', '$']]
  highlight:
    guessSyntax: true
    style: autumn
