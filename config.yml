baseURL: "https://florias-papadopoulos.github.io/"
title: Florias Papadopoulos
# (no theme: every template and style is the site's own; PaperMod, the theme the site started from, was removed on 2026-11-10)
locale: en

enableRobotsTXT: true
# No tags, categories or feed on this site: don't make (empty) pages for them
disableKinds: [taxonomy, term, rss]
disablePathToLower: true
pagination:
  pagerSize: 20

# Project pages and their files stay in _pages/projects (old URLs and GitHub links keep working):
# the .md files become pages under /projects/, everything else is served at /_pages/projects/.
module:
  mounts:
    - source: content
      target: content
    - source: _pages/projects
      target: content/projects
      files: ["**/*.md"]
    - source: static
      target: static
    - source: _pages/projects
      target: static/_pages/projects
      files: ["! **/*.md"]

# no menu: the normal side's pages have a sidebar (layouts/partials/site-nav.html), the lab's theirs (play-nav.html)

params:
  description: "Florias Papadopoulos, doctoral researcher in cryptography at the University of St. Gallen (HSG)."
  author: Florias Papadopoulos
  # Default picture when a page is shared (og:image, twitter:image), 1200x630, from static/img; drawn by
  # tools/make_share_card.py
  images: [img/share-card.jpg]
  DateFormat: January 2006
  defaultTheme: light
  hideFooter: false
  disableThemeToggle: true
  ShowReadingTime: false
  disableSpecial1stPost: true
  ShowCodeCopyButtons: true
  MainSections: [projects]
  disableScrollToTop: true
  ShowWordCount: false
  math: false
  profileMode:
    enabled: true
    title: Florias Papadopoulos
    nativeName: Φλωριάς Παπαδόπουλος
    kicker: Doctoral researcher · Applied cryptography
    location: St. Gallen, Switzerland
    badge: CYD Fellow
    badgeUrl: https://www.epfl.ch/research/funding/epfl-programmes/cyd/cyd-phd/
    tagline: My research covers provable security, post-quantum cryptography and privacy-preserving protocols, with a focus on secure, efficient **proximity tracking** and **collision avoidance**.
    interests: [Provable security, Post-quantum cryptography, Privacy-preserving protocols]
    # The route from the first stop to the current one ("now"), an arrow between them.
    # "projects" lists the entries whose context starts with that word in a hover tab ("noun" names them),
    # "url" is the page with all of them.
    journey:
      - stop: gr
        flag: 🇬🇷
        place: Thessaloniki, Greece
        school: Aristotle University of Thessaloniki
        when: then
        items:
          - label: BSc Mathematics
            projects: Bachelor
            url: /bachelor/
          - label: MSc Theoretical Computer Science & Control Theory
            projects: Master
            url: /master/
      - stop: ch
        flag: 🇨🇭
        place: St. Gallen, Switzerland
        school: University of St. Gallen (HSG)
        when: now
        items:
          - label: PhD, Cybersecurity & Applied Cryptography lab (Prof. Katerina Mitrokotsa)
            projects: Paper
            noun: paper
            url: /papers/
    # The "Latest" feed on the home page, under the route card: news and LinkedIn posts in one list, newest first
    # (shown in the order written here, so add new entries at the top). On desktop about three rows show and the
    # list scrolls for the rest; phones show every row. Each entry:
    #   date:     shown as written, e.g. "Sep 2026"
    #   text:     one short line, may use **bold**
    #   url:      optional, the main link (event page, article, paper); links starting with http open in a new tab
    #   linkedin: optional, the LinkedIn post about it (Share > Copy link). With url as well, a small "in" mark at
    #             the end of the row links to the post; without url, the text itself links to the post
    #   image:    optional, a small thumbnail under static/, e.g. img/linkedin/my-post.jpg (cropped to fill)
    #   alt:      optional, describes the picture
    # One thing, one entry: when a news item and a LinkedIn post are about the same event, give it both links.
    # tools/linkedin_post.py URL [URL ...] fetches a public post's text and picture and prints such an entry
    # (--write adds it at the top here).
    latest:
      - date: "Sep 2026"
        text: "Talk at **Swiss Crypto Day 2026**, ETH Zürich"
        url: https://swisscryptoday.github.io/2026-09/
        linkedin: https://www.linkedin.com/posts/florias-papadopoulos-b035ab233_cydfellowship-share-7505560149105856512-eSYg/
        image: img/linkedin/swiss-crypto-day.jpg
        alt: "Giving a talk in a lecture hall at ETH Zürich"
      - date: "Sep 2026"
        text: "One summer, four stops: talks on proximity testing in Germany, Switzerland and Italy"
        linkedin: https://www.linkedin.com/posts/florias-papadopoulos-b035ab233_really-enjoyed-all-four-of-these-new-topics-ugcPost-7504106199747923969-pcNe/
        image: img/linkedin/summer-four-stops.jpg
        alt: "Short talk at the ALPEC 2026 summer school in Trento"
      - date: "Jun 2026"
        text: "Presented our paper at **ACM AsiaCCS ’26** in Bangalore"
        linkedin: https://www.linkedin.com/posts/florias-papadopoulos-b035ab233_cydfellowship-acmasiaccs2026-asiaccs2026-ugcPost-7469375426713526272-uBmJ/
        image: img/linkedin/asiaccs-talk.jpg
        alt: "Presenting the paper at ACM AsiaCCS 2026"
      - date: "Jun 2026"
        text: "HSG features my **CYD Fellowship** research: optimising drone safety"
        url: https://www.unisg.ch/en/hsg-at-a-glance/optimising-drone-safety/
        linkedin: https://www.linkedin.com/posts/florias-papadopoulos-b035ab233_cydfellowship-share-7467521422588903424-AMZY/
        image: img/linkedin/hsg-feature.jpg
        alt: "Working on a drone in the lab with colleagues"
      - date: "Jun 2026"
        text: "New paper at **ACM ASIA CCS 2026**: Privacy-preserving Proximity Testing from Geometric Fuzzy Matching"
        url: https://dl.acm.org/doi/10.1145/3779208.3785374
      - date: "Dec 2025"
        text: "Hosted high school students at HSG: the Enigma machine and a first look at cybersecurity"
        linkedin: https://www.linkedin.com/posts/florias-papadopoulos-b035ab233_great-to-host-high-school-students-and-see-ugcPost-7406977583768035328-zYWJ/
        image: img/linkedin/enigma-students.jpg
        alt: "High school students at an Enigma machine session at HSG"
    imageUrl: my_profile_square.jpg
    imageTitle: Florias Papadopoulos
    imageWidth: 168
    imageHeight: 168
    # no Bachelor/Master/Papers buttons: the route from Greece to Switzerland (journey above) links to all three

  # The email address is kept as two reversed halves, so robots that collect addresses from pages (and this
  # repository) find nothing; assets/js/footer.js puts it together in the browser.
  contactMail: { u: "soluopodapap.sairolf", d: "hc.gsinu" }
  # the address on the CV page (layouts/_default/cv.html), kept the same way
  cvMail: { u: "soluopodapapsairolf", d: "moc.liamg" }
  socialIcons:
    - name: CV
      url: /cv/
    - name: email
      title: Email
      url: "#email"
    - name: orcid
      title: ORCID
      url: https://orcid.org/0009-0001-3684-5318
    - name: researchgate
      title: ResearchGate
      url: https://www.researchgate.net/profile/Florias-Papadopoulos
    - name: LinkedIn
      url: https://www.linkedin.com/in/florias-papadopoulos-b035ab233
    - name: GitHub
      url: https://github.com/florias-papadopoulos

  # "?v=key" makes browsers fetch the new (key) icon instead of a cached old one; bump it when the icon changes
  assets:
    disableScrollBarStyle: true
    favicon: favicon.ico?v=key
    favicon16x16: favicon-16x16.png?v=key
    favicon32x32: favicon-32x32.png?v=key
    apple_touch_icon: apple-touch-icon.png?v=key
    safari_pinned_tab: safari-pinned-tab.svg?v=key
  # The visit counter (tools/workers/stats, shown on /stats/). Empty means the counter is off and nothing is sent;
  # set it to the Worker URL (e.g. https://site-stats.NAME.workers.dev, no trailing slash) to switch it on.
  statsEndpoint: "https://florias-stats.floriaspapadopoulos.workers.dev"
  # Audience mode for talks (the hidden /live/ pages, worker in tools/workers/live). Empty means the pages only say
  # "not set up yet"; set it to the worker's URL (e.g. https://florias-live.NAME.workers.dev, no trailing slash).
  liveEndpoint: "https://florias-live.floriaspapadopoulos.workers.dev"
  cover:
    hiddenInList: false
    hiddenInSingle: true
  label:
    text: Florias Papadopoulos
    icon: favicon.ico?v=key
    iconHeight: 18

markup:
  goldmark:
    renderer:
      unsafe: true
    # Leave $...$ and $$...$$ untouched for KaTeX
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [['$$', '$$']]
          inline: [['$', '$']]
  highlight:
    guessSyntax: true
    style: autumn
