baseURL: "https://florias-papadopoulos.github.io/"
title: Florias Papadopoulos
theme: PaperMod
locale: en

enableRobotsTXT: true
disablePathToLower: true
pagination:
  pagerSize: 20

# Project pages and their files stay in _pages/projects (old URLs and GitHub links keep working):
# the .md files become pages under /projects/, everything else is served at /_pages/projects/.
module:
  mounts:
    - source: content
      target: content
    - source: _pages/projects
      target: content/projects
      files: ["**/*.md"]
    - source: static
      target: static
    - source: _pages/projects
      target: static/_pages/projects
      files: ["! **/*.md"]
    - source: files
      target: static/files
    - source: games
      target: static/games

menu:
  main:
    - name: Bachelor
      url: /bachelor/
      weight: 1
    - name: Master
      url: /master/
      weight: 1
    - name: Papers
      url: /papers/
      weight: 2
    - name: Games
      url: /games/
      weight: 3
    - name: CV
      url: /files/resume.pdf
      weight: 4

params:
  description: "Florias Papadopoulos, doctoral researcher in cryptography at the University of St. Gallen (HSG)."
  author: Florias Papadopoulos
  DateFormat: January 2006
  defaultTheme: light
  hideFooter: false
  disableThemeToggle: true
  ShowShareButtons: false
  ShowReadingTime: false
  disableSpecial1stPost: true
  disableAnchoredHeadings: true
  ShowPostNavLinks: false
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: true
  ShowAllPagesInArchive: false
  MainSections: [projects]
  ShowToc: false
  disableScrollToTop: true
  TocOpen: true
  ShowWordCount: false
  UseHugoToc: true
  comments: false
  math: false
  profileMode:
    enabled: true
    title: Florias Papadopoulos
    nativeName: Φλωριάς Παπαδόπουλος
    role: Doctoral researcher in cryptography · CYD Fellow
    interests: [Provable security, Post-quantum cryptography, Privacy-preserving protocols]
    focus: Designing secure and efficient systems for **proximity tracking** and **collision avoidance**.
    # Stops on the map (ids match the markers drawn by tools/make_map.py), oldest first.
    # "projects" lists the entries whose context starts with that word in a hover tab ("noun" names them),
    # "url" is the page with all of them.
    journey:
      - stop: gr
        place: Thessaloniki, Greece
        school: Aristotle University of Thessaloniki (AUTh)
        items:
          - label: BSc in Mathematics
            projects: Bachelor
            url: /bachelor/
          - label: MSc in Theoretical Computer Science and Control Theory
            projects: Master
            url: /master/
      - stop: ch
        place: St. Gallen, Switzerland
        school: University of St. Gallen (HSG)
        items:
          - label: Doctoral researcher, Cybersecurity and Applied Cryptography lab, supervised by Prof. Katerina Mitrokotsa
            projects: Paper
            noun: paper
            url: /papers/
    imageUrl: my_profile_square.jpg
    imageTitle: Florias Papadopoulos
    imageWidth: 168
    imageHeight: 168
    buttons:
      - name: Bachelor
        url: /bachelor/
      - name: Master
        url: /master/
      - name: Papers
        url: /papers/
      - name: Games
        url: /games/

  socialIcons:
    - name: CV
      url: /files/resume.pdf
    - name: LinkedIn
      url: https://www.linkedin.com/in/florias-papadopoulos-b035ab233
    - name: GitHub
      url: https://github.com/florias-papadopoulos
    - name: Instagram
      url: https://www.instagram.com/florias.pap/

  assets:
    disableScrollBarStyle: true
  cover:
    hiddenInList: false
    hiddenInSingle: true
  label:
    text: Florias Papadopoulos
    icon: favicon.ico
    iconHeight: 18

markup:
  goldmark:
    renderer:
      unsafe: true
    # Leave $...$ and $$...$$ untouched for KaTeX
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [['$$', '$$']]
          inline: [['$', '$']]
  highlight:
    guessSyntax: true
    style: autumn
