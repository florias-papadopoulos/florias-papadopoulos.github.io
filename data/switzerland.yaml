# The Visitors sheet: places for guests staying in St. Gallen, picked by the site's owner. Checked on 2026-11-28
# (travel times: SBB timetable through transport.opendata.ch; prices and seasons: the operators' own sites, with a
# second source each where one exists; details and URLs in __NotOnline/switzerland-guests/plan.md).
guests:
  # the Places tab's legend and filter, and the colour of each place's pin (a place may have several kinds; the first
  # gives its colour). Six kinds, chosen by the site's owner on 2026-11-28.
  kinds:
    - { id: walk, name: "Walks", short: "Walks", colour: "#4d7c0f" }
    - { id: hike, name: "Mountain hikes", short: "Hikes", colour: "#b45309" }
    - { id: winter, name: "Winter", short: "Winter", colour: "#2b6cb0" }
    - { id: family, name: "Animals and family", short: "Family", colour: "#c0267a" }
    - { id: culture, name: "Culture and museums", short: "Culture", colour: "#7b3fa0" }
    - { id: water, name: "Lakes and water", short: "Water", colour: "#0d8a8a" }
  # getting here (SBB timetable through transport.opendata.ch, checked 2026-11-28 for a Tuesday morning)
  arrival:
    - name: "From Zürich Airport"
      from: "Zürich Flughafen"
      to: "St. Gallen"
      text: "Direct trains, 49 to 61 min, several an hour."
  tickets:
    - name: "9 am day pass, all zones"
      price: "CHF 40"
      half: "CHF 20"
      note: "Eastern Switzerland, trains and buses. Weekdays from 9:00, weekends all day. CHF 41 from 13 Dec."
      best: true
    - name: "Saver Day Pass, all of Switzerland"
      price: "from CHF 52"
      half: "from CHF 29"
      half_label: "With Half Fare"
      note: "All of Switzerland, for the far trips. The price rises as passes sell: buy early, by the day before."
    - name: "Day Pass for Half Fare holders"
      half: "CHF 81"
      half_label: "With Half Fare"
      note: "All of Switzerland, fixed price, also on the day. CHF 78 until 12 Dec."
  tickets_note: "In the SBB Mobile app or at a ticket machine."
  # St. Gallen is the base. far: beyond the Ostwind area (an extra ticket). mins: the trip from St. Gallen station to
  # the start (SBB timetable; the way inside Ostwind where there is one), which groups the list; months: when it is open or doable (none = all year); rain: good
  # in bad weather; stop: the SBB stop for the card's train button; hike, grade (T1 to T3), line (a drawn path in
  # static/switzerland/visitor-routes.json): the walk's key facts. Facts and sources:
  # __NotOnline/switzerland-guests/catalogue.md.
  places:
    # ---- near, with the Ostwind pass ----
    - id: abbey
      mins: 8
      rain: true
      kinds: [culture]
      name: "Abbey Library"
      area: "St. Gallen"
      lon: 9.37639
      lat: 47.42273
      why: "A baroque library hall with medieval manuscripts, part of the Abbey precinct (UNESCO World Heritage)."
      trip: "7 to 10 min on foot"
      ostwind: "not needed (on foot)"
      extra: "Entry CHF 18"
      season: "Daily 10:00 to 17:00 (July to September until 18:00); closed 24 and 25 December"
      link: "https://www.stiftsbezirk.ch/"
    - id: oldtown
      mins: 8
      kinds: [culture]
      name: "Old town"
      area: "St. Gallen"
      lon: 9.37672
      lat: 47.42636
      why: "Car-free lanes with painted oriel windows, next to the abbey."
      trip: "8 min on foot"
      ostwind: "not needed (on foot)"
      season: "All year"
      link: "https://www.st.gallen-bodensee.ch/"
    - id: sternenstadt
      mins: 10
      months: [11, 12]
      kinds: [culture, winter]
      name: "Sternenstadt"
      area: "St. Gallen"
      lon: 9.3765
      lat: 47.4237
      why: "Christmas stars over the old town's lanes, and a Christmas market by the Abbey."
      trip: "About 10 min on foot"
      ostwind: "not needed (on foot)"
      extra: "Free"
      season: "26 November to 24 December 2026"
      link: "https://www.sternenstadt.ch/"
    - id: weieren
      hike: "5.6 km · 1 h 30"
      grade: T1
      line: true
      mins: 10
      kinds: [walk, water, winter]
      name: "Drei Weieren to Wenigerweiher"
      area: "St. Gallen"
      lon: 9.39048
      lat: 47.42264
      why: "Old bathing ponds above the town with a view over St. Gallen, then on along the signed Panoramaweg to the quiet Wenigerweiher, a nature reserve."
      trip: "On foot from the station, or the Mühleggbahn funicular from the old town; back from Schwarzer Bären by train (S21, S22, 15 min)"
      walk: "About 5.6 km, 250 m up, 1 h 30"
      ostwind: "yes"
      season: "All year; in winter the paths can be icy, and the Buebenweiher is opened for skating when the ice holds"
      link: "https://www.muehleggbahn.ch/"
    - id: haggen
      hike: "3 km · 45 min"
      grade: T1
      line: true
      mins: 10
      stop: "St. Gallen, Oberhofstetten"
