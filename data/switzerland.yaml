      walk: "Round the lake and up to the Gafalljoch about 9 km, 350 m up and down, 3 to 4 h; the lake alone about 6 km, 2 h"
      ostwind: "only with a combined ticket: Ostwind plus all of Vorarlberg (Kombi day ticket OTV-VVV), or the Lünersee Green Ticket from the border"
      extra: "Cable car EUR 26 return (2026); the Green Ticket (EUR 33) includes it and the Austrian trains and buses"
      season: "Cable car 22 May to 26 October 2027, 8:00 to 17:00 (last down 17:00)"
      know: "Take an ID and euros. If you miss the last cable car, the only way down is the steep Böser Tritt path"
      link: "https://luenersee.at/en/service-prices/opening-times"
