# the glacier cards (assets/js/switzerland/30-layers.js, GLACIERS): only figures confirmed by two sources (GLAMOS length
# change series, release 2026, doi:10.18750/lengthchange.2025.r2026, summed per year; and the sources named below)
glaciers:
  aletsch:
    title: "Great Aletsch Glacier"
    facts:
      - { label: "Shorter since 1870", value: "about 3.5 km (to 2025)" }
    note: "The longest glacier of the Alps."
    source: "Length change: GLAMOS, also reported by swissinfo. Extents: GLAMOS via swisstopo."
  rhone:
    title: "Rhône Glacier"
    facts:
      - { label: "Shorter since 1879", value: "about 1.9 km (to 2025)" }
    note: "The source of the Rhône."
    source: "Length change: GLAMOS; Ohmura (2025), Journal of Geography. Extents: GLAMOS via swisstopo."
  morteratsch:
    title: "Morteratsch Glacier"
    facts:
      - { label: "Shorter since 1878", value: "about 3.1 km (to 2025)" }
    note: "Its neighbour, the Pers Glacier, has broken away from it since about 2015."
    source: "Length change: GLAMOS; swisseduc.ch glacier archive. Extents: GLAMOS via swisstopo."

# Swiss glaciers as a whole: Mannerfelt et al. (2022), The Cryosphere 16, 3249; ETH and WSL press release (2022)
glacier_loss: "Swiss glaciers lost about half of their volume between 1931 and 2016."

