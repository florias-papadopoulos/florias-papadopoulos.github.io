# Facts for the Switzerland page (layouts/switzerland/list.html, assets/js/switzerland/map.js). Every fact here was
# checked against two independent sources (listed under sources). Canton areas come from swisstopo's
# swissBOUNDARIES3D (static/switzerland/cantons.json, made by tools/swiss-map/make_map.py) and are not repeated here.

instagram: https://www.instagram.com/florias.pap/

numbers:
  - { label: "Highest point", value: "4634", unit: "m", note: "Dufourspitze, Monte Rosa" }
  - { label: "Lowest point", value: "193", unit: "m", note: "Lago Maggiore" }
  - { label: "Area", value: "41 291", unit: "km²" }
  - { label: "Cantons", value: "26" }
  - { label: "National languages", value: "4", note: "German, French, Italian, Romansh" }
  - { label: "Marked hiking trails", value: "65 000", unit: "km" }
  - { label: "Glaciers", value: "1 400", note: "about, Swiss Glacier Inventory 2016" }
  - { label: "Highest settlement", value: "2126", unit: "m", note: "Juf, Avers (GR)" }

signs:
  - { id: yellow, name: "Hiking trail", scale: "T1", text: "Yellow signposts and diamonds. No special demands on the hiker." }
  - { id: red, name: "Mountain hiking trail", scale: "T2 to T3", text: "White-red-white. Steep, narrow, at times exposed paths: sure-footed, no fear of heights, in good shape." }
  - { id: blue, name: "Alpine hiking route", scale: "T4 to T5", text: "White-blue-white. Partly over snowfields, glaciers or scree: very good shape and mountain experience. T6 routes are mostly not marked." }
  - { id: pink, name: "Winter hiking trail", text: "Pink signs. Prepared paths through the snow; watch the weather and slippery ground." }

# capital and official languages of each canton, by code (as in cantons.json); joined = year it joined the
# Confederation (1291 is the traditional founding year; OW and NW joined as Unterwalden, BL as Basel, AR and AI as
# Appenzell). AR's constitution names no capital: Herisau is the seat of government and parliament.
cantons:
  ZH: { capital: "Zürich", languages: "German", joined: 1351 }
  BE: { capital: "Bern", languages: "German, French", joined: 1353 }
  LU: { capital: "Lucerne", languages: "German", joined: 1332 }
  UR: { capital: "Altdorf", languages: "German", joined: 1291 }
  SZ: { capital: "Schwyz", languages: "German", joined: 1291 }
  OW: { capital: "Sarnen", languages: "German", joined: 1291 }
  NW: { capital: "Stans", languages: "German", joined: 1291 }
  GL: { capital: "Glarus", languages: "German", joined: 1352 }
  ZG: { capital: "Zug", languages: "German", joined: 1352 }
  FR: { capital: "Fribourg", languages: "French, German", joined: 1481 }
  SO: { capital: "Solothurn", languages: "German", joined: 1481 }
  BS: { capital: "Basel", languages: "German", joined: 1501 }
  BL: { capital: "Liestal", languages: "German", joined: 1501 }
  SH: { capital: "Schaffhausen", languages: "German", joined: 1501 }
  AR: { capital: "Herisau (seat of government; courts in Trogen)", languages: "German", joined: 1513 }
  AI: { capital: "Appenzell", languages: "German", joined: 1513 }
  SG: { capital: "St. Gallen", languages: "German", joined: 1803 }
  GR: { capital: "Chur", languages: "German, Romansh, Italian", joined: 1803 }
