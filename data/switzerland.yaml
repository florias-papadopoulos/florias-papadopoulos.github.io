# The Visitors sheet: places for guests staying in St. Gallen, picked by the site's owner. Checked on 2026-11-28
# (travel times: SBB timetable through transport.opendata.ch; prices and seasons: the operators' own sites, with a
# second source each where one exists; details and URLs in __NotOnline/switzerland-guests/plan.md).
guests:
  region: [8.45, 47.05, 9.75, 47.75]
  tickets:
    - name: "9 am day pass, all zones"
      price: "CHF 40"
      half: "CHF 20"
      note: "Mon to Fri from 9:00, weekends all day, until 5:00 the next morning. Trains and buses in the whole Ostwind area, no boats. CHF 41 from 13 December 2026."
      best: true
  tickets_note: "Buy them in the SBB Mobile app or at a ticket machine. Zürich and Luzern are outside Ostwind: they need a normal SBB ticket."
  places:
    - id: abbey
      name: "Abbey Library"
      area: "St. Gallen"
      lon: 9.37639
      lat: 47.42273
      why: "A baroque library hall with medieval manuscripts, part of the Abbey precinct (UNESCO World Heritage)."
      trip: "7 to 10 min on foot"
      ostwind: "not needed (on foot)"
      extra: "Entry CHF 18"
      season: "Daily 10:00 to 17:00 (July to September until 18:00); closed 24 and 25 December"
      link: "https://www.stiftsbezirk.ch/"
    - id: oldtown
      name: "Old town"
      area: "St. Gallen"
      lon: 9.37672
      lat: 47.42636
      why: "Car-free lanes with painted oriel windows, next to the abbey."
      trip: "8 min on foot"
      ostwind: "not needed (on foot)"
      season: "All year"
      link: "https://www.st.gallen-bodensee.ch/"
    - id: weieren
      name: "Drei Weieren"
      area: "St. Gallen"
      lon: 9.39048
      lat: 47.42264
      why: "Old ponds above the town with a view over St. Gallen; swimming in summer."
      trip: "The Mühleggbahn funicular from near the old town, then about 15 min on foot"
      ostwind: "yes"
      season: "All year"
      link: "https://www.muehleggbahn.ch/"
    - id: appenzell
      name: "Appenzell"
      area: "Appenzell"
      lon: 9.40953
      lat: 47.32853
      why: "Painted houses on the Hauptgasse and the square of the open-air assembly."
      trip: "36 min by train (S21, direct, every 30 min)"
      ostwind: "yes"
      season: "All year"
      link: "https://www.appenzell.ch/en/appenzell.html"
    - id: ebenalp
      name: "Ebenalp and Äscher"
      area: "Appenzell"
      lon: 9.41426
      lat: 47.28333
      why: "Cable car up the Alpstein, the Wildkirchli caves and the guesthouse built into the cliff."
      trip: "51 min to Wasserauen (S21, change at Appenzell), then the cable car"
      ostwind: "train yes, cable car no"
      extra: "Cable car CHF 24 up, CHF 36 return (half with Half Fare)"
      season: "Cable car closed until 24 December 2026 and 30 March to 27 April 2027; the Äscher opens May to October"
      link: "https://www.ebenalp.ch/"
    - id: seealpsee
      name: "Seealpsee"
      area: "Appenzell"
      lon: 9.40210
      lat: 47.26970
      why: "A mountain lake below the Säntis, reached on a quiet road."
      trip: "51 min to Wasserauen, then about 1 h on foot"
      ostwind: "yes"
      season: "All year; best May to October"
      link: "https://www.appenzell.ch/"
    - id: bodensee
      name: "Lake Constance"
      area: "Lakes"
      lon: 9.49292
      lat: 47.47859
      why: "Lake promenade at Rorschach and boats along the Swiss shore."
      trip: "21 min by train to Rorschach"
      ostwind: "train yes, boat no (separate ticket)"
      season: "Boats from 26 March to 10 October 2027"
      link: "https://www.bodensee-schiffe.ch/"
    - id: rheinfall
      name: "Rhine Falls"
      area: "Lakes"
      lon: 8.61570
      lat: 47.67772
      why: "Europe's largest waterfall; a small boat goes to the rock in the middle."
      trip: "About 1 h via Winterthur, or 2 h inside Ostwind via Stein am Rhein"
      ostwind: "only the slow way via Stein am Rhein; via Winterthur needs another ticket"
      extra: "Schloss Laufen side CHF 5; rock boat CHF 22.50"
      season: "Rock boat April to October; most water in early summer"
      link: "https://www.rheinfall.ch/"
    - id: stein
      name: "Stein am Rhein"
      area: "Lakes"
      lon: 8.85962
      lat: 47.65927
      why: "A medieval little town on the Rhine with painted facades."
      trip: "1 h 24 by train (S1, direct along the lake)"
      ostwind: "yes"
      season: "All year"
      link: "https://www.steinamrhein.ch/"
    - id: walensee
      name: "Walensee and Quinten"
      area: "Lakes"
      lon: 9.21601
      lat: 47.12890
      why: "A fjord-like lake below the Churfirsten; Quinten, a car-free wine village, is reached only by boat."
      trip: "1 h 10 by train to Murg, then the boat across (about 1 h 35 in all)"
      ostwind: "train yes, boat no (separate ticket)"
      extra: "Half Fare, GA, the SBB app and FAIRTIQ are not valid on the Walensee boats"
      season: "The crossing to Quinten runs all year"
      link: "https://walenseeschiff.ch/"
