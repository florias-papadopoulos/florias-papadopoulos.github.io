# Facts for the Switzerland page (layouts/switzerland/list.html, assets/js/switzerland/map.js). Every fact here was
# checked against two independent sources (listed under sources). Canton areas come from swisstopo's
# swissBOUNDARIES3D (static/switzerland/cantons.json, made by tools/swiss-map/make_map.py) and are not repeated here.

instagram: https://www.instagram.com/florias.pap/

# First time in Switzerland? (the about sheet). Each tip checked on 2026-11-28 against two sources, listed per tip.
visitors:
  # Your Europe (European Commission), roaming: "Roam like at home" covers the EU, Iceland, Liechtenstein, Norway,
  # Moldova and Ukraine, not Switzerland (checked 2026-11-28)
  - { title: "Mobile data.", text: "EU roaming (Roam like at home) does not cover Switzerland, so data can be expensive on an EU plan. Check your plan, or get a travel eSIM or a Swiss prepaid SIM." }
  # BAV fact sheet on public transport; SBB offers for guests from abroad; SBB Half Fare Card
  - title: "Getting around."
    text: "Trains, buses and boats share one timetable and one ticket."
    links:
      - { text: "Timetable", url: "https://www.sbb.ch/en" }
      - { text: "Swiss Travel Pass", url: "https://www.sbb.ch/en/offers/guests-from-abroad" }
      - { text: "Half Fare Card", url: "https://www.sbb.ch/en/offers/swiss-half-fare-card" }
  # canton Aargau fountain labelling leaflet; The Local on Swiss drinking water; eaupotable.info maps public fountains
  - title: "Water."
    text: "Tap and fountain water is drinkable unless a sign says it is not (Kein Trinkwasser, eau non potable)."
    links:
      - { text: "Map of drinking fountains", url: "https://eaupotable.info/en/ch-switzerland" }
  # Zurich Tourism electric power; MySwitzerland electricity
  - title: "Plugs."
    text: "Type J sockets, 230 V. Two-pin Europlugs fit; for earthed plugs bring a Type J adapter."
    plug: true
    links:
      - { text: "More on plugs", url: "https://www.zuerich.com/en/electric-power-and-internet" }

# The big caves (the map's Caves layer). Each figure checked on 2026-11-28 against two sources (named per cave); positions
# from swisstopo's place names (cave entrances; Hoelloch at the bus stop by its entrance; Siebenhengste at the ridge
# above the system).
caves:
  - name: "Hölloch"
    lon: 8.7827
    lat: 46.9769
    facts:
      - { label: "Length", value: "213 km surveyed (2022)" }
      - { label: "Height range", value: "1033 m" }
      - { label: "Visit", value: "Guided tours only, booking needed" }
    note: "The longest cave in Switzerland and one of the longest in the world (about 12th)."
    link: "https://www.trekking.ch/hoelloch"
    source: "Hoelloch research group (AGH) cave list; Trekking Team, the tour operator."
  - name: "Siebenhengste-Hohgant cave system"
    lon: 7.8181
    lat: 46.7575
    facts:
      - { label: "Length", value: "164.5 km" }
      - { label: "Depth", value: "1340 m" }
      - { label: "Visit", value: "Cavers only" }
    note: "The second longest in Switzerland. The Bärenschacht nearby (84 km) may one day be joined to it."
    source: "SGH Bern (Swiss Society for Speleology); SRF (2023)."
  - name: "St. Beatus Caves"
    lon: 7.7819
    lat: 46.6847
    facts:
      - { label: "Explored", value: "about 14 km" }
      - { label: "Open to visitors", value: "about 1 km, self-guided" }
      - { label: "Visit", value: "All year" }
    link: "https://www.beatushoehlen.swiss/en/"
    source: "St. Beatus Caves; Interlaken Tourism."
  - name: "Lac souterrain de Saint-Léonard"
    lon: 7.426
    lat: 46.257
    facts:
      - { label: "Lake", value: "300 m long" }
      - { label: "Visit", value: "Guided boat tours, mid-March to 1 November" }
    note: "An underground lake you cross by rowing boat."
    link: "https://www.lac-souterrain.com/"
    source: "Lac souterrain de Saint-Léonard; Valais Tourism."
  - name: "Grottes de Vallorbe"
    lon: 6.3458
    lat: 46.6981
    facts:
      - { label: "Route", value: "1 km, about an hour" }
      - { label: "Visit", value: "Self-guided, March to November" }
    note: "The underground river Orbe and its dripstone halls."
    link: "https://grottesdevallorbe.ch/"
    source: "Grottes de Vallorbe; showcaves.com."
  - name: "Höllgrotten"
    lon: 8.5574
    lat: 47.186
    facts:
      - { label: "Found", value: "1863, while quarrying tufa" }
      - { label: "Visit", value: "Self-guided, April to October" }
    link: "https://www.hoellgrotten.ch/"
    source: "Höllgrotten; Zug Tourism."
  - name: "Grottes de Réclère"
    lon: 6.9135
    lat: 47.3586
    facts:
      - { label: "Found", value: "1886, open to visitors since 1890" }
      - { label: "Visit", value: "Guided tours, April to early November" }
    link: "https://www.prehisto.ch/"
    source: "Préhisto-Parc et Grottes de Réclère; showcaves.com."

signs:
  - { id: yellow, name: "Hiking trail", scale: "T1", text: "Yellow signposts and diamonds. No special demands on the hiker." }
  - { id: red, name: "Mountain hiking trail", scale: "T2 to T3", text: "White-red-white. Steep, narrow, at times exposed paths: sure-footed, no fear of heights, in good shape." }
  - { id: blue, name: "Alpine hiking route", scale: "T4 to T5", text: "White-blue-white. Partly over snowfields, glaciers or scree: very good shape and mountain experience. T6 routes are mostly not marked." }
  - { id: pink, name: "Winter hiking trail", text: "Pink signs. Prepared paths through the snow; watch the weather and slippery ground." }

# capital and official languages of each canton, by code (as in cantons.json); joined = year it joined the
# Confederation (1291 is the traditional founding year; OW and NW joined as Unterwalden, BL as Basel, AR and AI as
# Appenzell). AR's constitution names no capital: Herisau is the seat of government and parliament.
