# The CV page (/cv/, layouts/_default/cv.html, styles assets/css/common/cv.css), written to look exactly like the PDF
# (moderncv, style "classic", colour "red"). Every entry is one \cventry of the LaTeX source, field by field:
#
#   \cventry{date}{title \newline {\normalfont sub}}{employer}{city}{grade}{desc}
#
#   date      the left column
#   title     bold; *text* inside it is upright weight italic (the source's {\normalfont \textit{...}})
#   sub       optional, a second line under the title in normal weight (*...* for italic)
#   employer  optional, italic, after ", "
#   city      optional, after ", "
#   grade     optional, after ", "
#               the line then ends with "." as moderncv does
#   desc      optional, in the small font on the next line; when the PDF sets it on several lines, a list of
#               those lines (so the page breaks them in the same places)
#   items     optional, a list in the small font (the source's itemize)
#
# A \cvitem (left label, plain text, no full stop) is { date, text }. { heading: ... } is a \subsection.
# Every field is Markdown (*italic*, [link](url)). Keep it in step with the LaTeX source of the PDF.
