{{- /* Games page: a grid of small games played with the cat. The list is in content/games/_index.md; each game is
       assets/js/games/<id>.js (or <script>.js when the entry names one), loaded only when opened, run by the shell
       assets/js/games/arcade.js (styles: assets/css/common/arcade.css). data-server: the site's small server
       (params.statsEndpoint), which two-player games use to find each other. */ -}}
{{- define "main" }}
{{- $list := slice }}
{{- range .Params.games }}
{{- $g := . }}
{{- $src := "" }}{{ $sri := "" }}
{{- with resources.Get (printf "js/games/%s.js" ($g.script | default $g.id)) }}{{ $js := . | minify | fingerprint }}{{ $src = $js.RelPermalink }}{{ $sri = $js.Data.Integrity }}{{ end }}
{{- $list = $list | append (dict "id" $g.id "title" $g.title "emoji" $g.emoji "desc" $g.desc "group" ($g.group | default "simple") "levels" ($g.levels | default false) "restart" ($g.restart | default true) "src" $src "integrity" $sri) }}
{{- end }}
<div class="arcade" id="arcade" data-games="{{ $list | jsonify }}"{{ with site.Params.statsEndpoint }} data-server="{{ . }}"{{ end }}>
    <header class="arcade-head">
        <h1>Games</h1>
        {{- with .Params.intro }}<p class="arcade-intro">{{ . }}</p>{{ end }}
        {{- /* The music button: a menu of four background mixes (10+ minutes each, several CC0 tracks joined), files in
               static/music, every track credited in static/music/credits.txt. It sits here on the list and moves into
               the top bar of a running game. */}}
        {{- $mixes := slice
            (dict "id" "edm" "name" "EDM" "tracks" 6 "min" 12 "file" "mix-edm.mp3")
            (dict "id" "rock" "name" "Rock" "tracks" 7 "min" 12 "file" "mix-rock.mp3")
            (dict "id" "chiptune" "name" "Chiptune" "tracks" 6 "min" 12 "file" "mix-chiptune.mp3")
            (dict "id" "lofi" "name" "Lo-fi" "tracks" 5 "min" 11 "file" "mix-lofi.mp3") }}
        <div class="music" hidden>
            <button class="arcade-btn music-btn" type="button" title="Music" aria-label="Music" aria-expanded="false" aria-controls="music-menu">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 17.5V5.5l11-2.5v12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6.2" cy="17.5" r="2.9" fill="currentColor"/><circle cx="17.2" cy="15" r="2.9" fill="currentColor"/></svg>
            </button>
            <div class="music-menu" id="music-menu" role="group" aria-label="Music" hidden>
                <fieldset class="music-mixes">
                    <legend>Music</legend>
                    <label class="music-mix"><input type="radio" name="music-mix" value="off" checked><span class="mm-name">Off</span></label>
                    {{- range $mixes }}
                    <label class="music-mix"><input type="radio" name="music-mix" value="{{ .id }}" data-src="{{ printf "music/%s" .file | relURL }}" data-tracks="{{ .tracks }}"><span class="mm-name">{{ .name }}</span><span class="mm-title">{{ .tracks }} tracks, {{ .min }} min</span></label>
                    {{- end }}
                </fieldset>
                <label class="music-vol"><span>Volume</span><input type="range" min="0" max="100" step="1" value="45"></label>
                <p class="music-credit" data-credits="{{ "music/credits.txt" | relURL }}"></p>
            </div>
        </div>
    </header>
    {{- /* Three tabs (Best, 2 Player, More; Best opens first), one panel of cards each; arcade.js switches them and opens the tab of a game
           that is started from a link. */}}
    {{- $groups := slice (slice "complex" "Best") (slice "two" "2 Player") (slice "simple" "More") }}
    <div class="arcade-tabs" role="tablist" aria-label="Game groups">
        {{- range $i, $g := $groups }}
        <button class="arcade-tab" type="button" role="tab" id="tab-{{ index $g 0 }}" aria-controls="panel-{{ index $g 0 }}" aria-selected="{{ if eq $i 0 }}true{{ else }}false{{ end }}"{{ if ne $i 0 }} tabindex="-1"{{ end }}>{{ index $g 1 }}</button>
        {{- end }}
    </div>
    {{- range $i, $g := $groups }}
    {{- $games := where $list "group" (index $g 0) }}
    <div class="arcade-grid" role="tabpanel" id="panel-{{ index $g 0 }}" aria-labelledby="tab-{{ index $g 0 }}"{{ if ne $i 0 }} hidden{{ end }}>
        {{- range $games }}
        <button class="game-card" type="button" data-id="{{ .id }}"{{ if not .src }} disabled{{ end }}>
            <span class="gc-icon" aria-hidden="true">{{ .emoji }}</span>
            <span class="gc-title">{{ .title }}</span>
            <span class="gc-desc">{{ if .src }}{{ .desc }}{{ else }}Coming soon{{ end }}</span>
            <span class="gc-best" data-best="{{ .id }}"></span>
        </button>
        {{- end }}
    </div>
    {{- end }}

    <section class="arcade-stage" hidden aria-live="polite">
        <div class="stage-bar">
            <button class="arcade-btn stage-back" type="button" aria-label="Back to the games">&larr;<span class="stage-back-label"> Games</span></button>
            <span class="stage-title"></span>
            <span class="stage-score"></span>
            <span class="stage-best"></span>
            <select class="arcade-btn stage-level" aria-label="Difficulty" hidden>
                <option value="easy">Easy</option><option value="normal">Normal</option><option value="hard">Hard</option>
            </select>
            <button class="arcade-btn stage-restart" type="button" title="Restart">&#8635;</button>
        </div>
        <div class="stage-area"></div>
        <div class="stage-msg" hidden>
            <div class="stage-msg-box">
                <p class="stage-msg-text"></p>
                <button class="arcade-btn stage-again" type="button">Play again</button>
            </div>
        </div>
        <div class="cat mascot" aria-hidden="true"><div class="cat-tilt"><div class="cat-flip">{{ partial "cat-svg.html" . }}</div></div></div>
    </section>
</div>
{{- $shell := resources.Get "js/games/arcade.js" | minify | fingerprint }}
<script src="{{ $shell.RelPermalink }}" integrity="{{ $shell.Data.Integrity }}" defer></script>
{{- end }}
