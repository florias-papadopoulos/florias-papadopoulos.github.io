{{- /* /phd/projects/ (content/phd/projects/_index.md): the PhD projects as cards, each opening its own page.
       Styles: assets/css/common/phd.css. */ -}}
{{- define "main" }}
<div class="tl-page phd-page">
    <header class="tl-intro">
        <h1 class="tl-h1"><span class="tl-h1-text">{{ .Title }}</span></h1>
        {{- with .Content }}<div class="tl-lede">{{ . }}</div>{{ end }}
    </header>
    {{- partial "phd-cards.html" . }}
</div>
{{- end }}
