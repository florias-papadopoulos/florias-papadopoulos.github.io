{{- /* The cat and its research lab on the home page: markup here, behaviour in assets/js/home-lab.js,
       styles in assets/css/common/cat.css */ -}}
<div class="world-layer" id="world-layer" aria-hidden="true"><svg class="terrain" id="terrain"></svg></div>
<div class="cat-layer" id="cat-layer">
    <div class="cat" id="cat" role="button" tabindex="0" aria-label="A cat. Click to pet it.">
        <div class="cat-tilt"><div class="cat-flip">
        <svg viewBox="0 0 110 90" aria-hidden="true">
            <!-- standing (moving) -->
            <g class="p-stand"><g class="body-bob">
                <g class="leg bf fur-dark ol"><rect x="30" y="54" width="9" height="28" rx="4.5"/><ellipse cx="35" cy="84" rx="6" ry="3.4"/></g>
                <g class="leg ff fur-dark ol"><rect x="72" y="54" width="9" height="28" rx="4.5"/><ellipse cx="78" cy="84" rx="6" ry="3.4"/></g>
                <g class="tail"><path class="tail-ol" d="M27 52C12 46 8 30 15 20c3-4 8-3 7 2"/><path class="tail-fur" d="M27 52C12 46 8 30 15 20c3-4 8-3 7 2"/></g>
                <path class="fur ol" d="M24 49c0-10 9-15 26-14h18c13 0 19 7 17 17-2 10-10 12-20 12H40c-12 0-17-6-16-15z"/>
                <path class="cream" d="M40 62c8 3 22 3 30 0-2 2-6 3-15 3s-13-1-15-3z"/>
                <path class="stripe" d="M44 37q3 6 1 12M53 36q3 7 1 13M62 36q3 6 1 12"/>
                <g class="leg bn fur ol"><rect x="36" y="54" width="9" height="28" rx="4.5"/><ellipse cx="41" cy="84" rx="6" ry="3.4"/></g>
                <g class="leg fn fur ol"><rect x="66" y="54" width="9" height="28" rx="4.5"/><ellipse cx="72" cy="84" rx="6" ry="3.4"/></g>
            </g></g>
            <!-- sitting (idle) -->
            <g class="p-sit">
                <g class="tail"><path class="tail-ol" d="M40 82C24 88 12 82 16 72c2-5 8-4 8 0"/><path class="tail-fur" d="M40 82C24 88 12 82 16 72c2-5 8-4 8 0"/></g>
                <ellipse class="fur-dark ol" cx="74" cy="84" rx="6" ry="3.4"/>
                <path class="fur ol" d="M38 84c-6-18 2-38 22-40 16-1 22 16 16 40z"/>
                <path class="cream" d="M58 50c8 1 12 12 9 30-4 2-10 2-14 0-3-14-1-28 5-30z"/>
                <ellipse class="fur ol" cx="46" cy="72" rx="13" ry="13"/>
                <path class="stripe" d="M38 62q5 3 4 9M44 58q5 4 4 10"/>
                <ellipse class="fur ol" cx="52" cy="85" rx="8" ry="3.6"/>
                <g class="paw-arm"><rect class="fur ol" x="65" y="56" width="9" height="28" rx="4.5"/><ellipse class="fur ol" cx="70" cy="84" rx="6" ry="3.4"/></g>
            </g>
            <!-- curled up (sleeping) -->
            <g class="p-sleep">
                <ellipse class="fur ol" cx="52" cy="74" rx="32" ry="15"/>
                <path class="stripe" d="M40 62q3 5 1 10M50 60q3 6 1 11M60 61q3 5 1 10"/>
                <path class="tail-ol" d="M22 76c2 16 52 18 64 4"/><path class="tail-fur" d="M22 76c2 16 52 18 64 4"/>
            </g>
            <!-- head (moved by pose) -->
            <g class="cat-head">
                <path class="fur ol" d="M-15-7l1-19 12 10zM3-16l12-10 2 19z"/>
                <path class="pink" d="M-12-10l1-11 6 6zM6-15l7-6 1 10z"/>
                <ellipse class="fur ol" cx="0" cy="0" rx="18" ry="15.5"/>
                <path class="stripe" d="M-4-14q0 4-1 6M1-15v6M6-14q0 4 1 6"/>
                <ellipse class="cream" cx="3" cy="7" rx="10" ry="6.5"/>
                <g class="eye-open">
                    <ellipse fill="#fff" class="ol" stroke-width="1.3" cx="-6" cy="-2" rx="4.4" ry="5.4"/>
                    <ellipse fill="#fff" class="ol" stroke-width="1.3" cx="8" cy="-2" rx="4.4" ry="5.4"/>
                    <ellipse class="ink" cx="-5" cy="-1.5" rx="2.6" ry="3.8"/><ellipse class="ink" cx="9" cy="-1.5" rx="2.6" ry="3.8"/>
                    <circle fill="#fff" cx="-4" cy="-3.4" r="1.1"/><circle fill="#fff" cx="10" cy="-3.4" r="1.1"/>
                </g>
                <path class="eye-happy ink-line" d="M-9.5-1q3.5-4.5 7 0M4.5-1q3.5-4.5 7 0"/>
                <path class="eye-sleep ink-line" d="M-9.5-2q3.5 3.5 7 0M4.5-2q3.5 3.5 7 0"/>
                <g class="blush pink" opacity=".7"><ellipse cx="-11" cy="6" rx="3" ry="1.8"/><ellipse cx="14" cy="6" rx="3" ry="1.8"/></g>
                <path class="pink" d="M1 4h4l-2 2.4z"/>
                <path class="ink-line" stroke-width="1.2" d="M3 6.5q-1.8 3-4 1.6M3 6.5q1.8 3 4 1.6"/>
                <path class="whisker" d="M12 6l13-2M12 8.5l13 2M-7 6l-12-2M-7 8.5l-12 2"/>
            </g>
        </svg>
        </div></div>
    </div>
</div>

{{- $js := resources.Get "js/home-lab.js" | minify | fingerprint }}
<script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" defer></script>
