{{- /* The cat and its research lab on the home page: markup here, behaviour in assets/js/home-lab.js,
       styles in assets/css/common/cat.css */ -}}
<div class="world-layer" id="world-layer" aria-hidden="true"><svg class="terrain" id="terrain"></svg></div>
<div class="cat-layer" id="cat-layer">
    <div class="cat" id="cat" role="button" tabindex="0" aria-label="A cat. Click to pet it.">
        <div class="cat-tilt"><div class="cat-flip">
        <svg viewBox="0 0 110 90" aria-hidden="true">
            <defs>
                <linearGradient id="cat-fur" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc06e"/><stop offset="1" stop-color="#f0932c"/></linearGradient>
                <radialGradient id="cat-head" cx=".42" cy=".3" r=".85"><stop offset="0" stop-color="#ffc479"/><stop offset="1" stop-color="#f0932c"/></radialGradient>
            </defs>
            <ellipse class="shadow" cx="56" cy="87.5" rx="30" ry="3.2"/>
            <!-- standing (moving) -->
            <g class="p-stand"><g class="body-bob">
                <g class="leg bf fur-dark ol"><rect x="30" y="54" width="9" height="28" rx="4.5"/><ellipse cx="35" cy="84" rx="6.2" ry="3.5"/></g>
                <g class="leg ff fur-dark ol"><rect x="72" y="54" width="9" height="28" rx="4.5"/><ellipse cx="78" cy="84" rx="6.2" ry="3.5"/></g>
                <g class="tail">
                    <path class="tail-ol" d="M27 52C12 46 8 30 15 20c3-4 8-3 7 2"/><path class="tail-fur" d="M27 52C12 46 8 30 15 20c3-4 8-3 7 2"/>
                    <path class="tail-stripe" d="M27 52C12 46 8 30 15 20"/><path class="tail-tip" d="M15 20c3-4 8-3 7 2"/>
                </g>
                <path class="fur ol" d="M24 49c0-10 9-15 26-14h18c13 0 19 7 17 17-2 10-10 12-20 12H40c-12 0-17-6-16-15z"/>
                <path class="cream" d="M40 62c8 3 22 3 30 0-2 2-6 3-15 3s-13-1-15-3z"/>
                <path class="cream" d="M76 45c5 2 8 6 7 12l-2-1 .5 3-2.5-1-.5 3c-3-4-4-11-2.5-16z"/>
                <path class="stripe" d="M41 37q3.5 6 1.5 12M50 35.6q3.5 7 1.5 13M59 35.8q3.5 6.5 1.5 12.5M67 37q2.5 5 1 10"/>
                <g class="leg bn fur ol"><rect x="36" y="54" width="9" height="28" rx="4.5"/><ellipse cx="41" cy="84" rx="6.2" ry="3.5"/><path class="toe" d="M39.5 82.6v2.2M42.5 82.6v2.2"/></g>
                <g class="leg fn fur ol"><rect x="66" y="54" width="9" height="28" rx="4.5"/><ellipse cx="72" cy="84" rx="6.2" ry="3.5"/><path class="toe" d="M70.5 82.6v2.2M73.5 82.6v2.2"/></g>
            </g></g>
            <!-- sitting (idle) -->
            <g class="p-sit">
                <g class="tail">
                    <path class="tail-ol" d="M40 82C24 88 12 82 16 72c2-5 8-4 8 0"/><path class="tail-fur" d="M40 82C24 88 12 82 16 72c2-5 8-4 8 0"/>
                    <path class="tail-stripe" d="M40 82C24 88 12 82 16 72"/><path class="tail-tip" d="M16 72c2-5 8-4 8 0"/>
                </g>
                <ellipse class="fur-dark ol" cx="74" cy="84" rx="6.2" ry="3.5"/>
                <path class="fur ol" d="M38 84c-6-18 2-38 22-40 16-1 22 16 16 40z"/>
                <path class="cream" d="M58 49c9 1 13 12 10 31-4 2-10 2-14 0-3-14-2-29 4-31z"/>
                <path class="cream" d="M57 49l3 3 2-3 2 3 2-3 2 3" fill="none" stroke="#ffe7c2" stroke-width="2"/>
                <ellipse class="fur ol" cx="46" cy="72" rx="13" ry="13"/>
                <path class="stripe" d="M37 63q5 3 4 9M43 59q5 4 4 10M50 60q3 4 2 8"/>
                <ellipse class="fur ol" cx="52" cy="85" rx="8.4" ry="3.7"/><path class="toe" d="M50.5 83.5v2.2M53.5 83.5v2.2"/>
                <g class="paw-arm"><rect class="fur ol" x="65" y="56" width="9" height="28" rx="4.5"/><ellipse class="fur ol" cx="70" cy="84" rx="6.2" ry="3.5"/><path class="toe" d="M68.5 82.6v2.2M71.5 82.6v2.2"/></g>
            </g>
            <!-- curled up (sleeping) -->
            <g class="p-sleep">
                <ellipse class="fur ol" cx="52" cy="74" rx="32" ry="15"/>
                <path class="cream" d="M30 80c10 5 34 6 46 0-6 4-38 5-46 0z"/>
                <path class="stripe" d="M36 63q3 5 1 10M45 60.5q3 6 1 11M54 60q3 6 1 11M63 61.5q3 5 1 10"/>
                <path class="tail-ol" d="M22 76c2 16 52 18 64 4"/><path class="tail-fur" d="M22 76c2 16 52 18 64 4"/>
                <path class="tail-stripe" d="M22 76c2 16 52 18 64 4"/>
            </g>
            <!-- head (moved by pose) -->
            <g class="cat-head">
                <path class="fur ol" d="M-16-5l2-22q6 5 12 12zM2-15q6-7 12-12l2 22z"/>
                <path class="pink" d="M-13.5-9l1-13q4 3.6 7.5 7.5zM5-14.5q3.5-3.9 7.5-7.5l1 13z"/>
                <path class="tuft" d="M-11.5-13.5l-2.5-4.5M-9.5-12.5l-1-4.5M11.5-13.5l2.5-4.5M9.5-12.5l1-4.5"/>
                <path class="head ol" d="M0-15.5C11-15.5 18.5-9 18.5 0c0 4-1.5 7-3 9l3 2-5 1 1.5 2.5H9C6 15.8 3 16.2 0 16.2s-6-.4-9-1.7h-6l1.5-2.5-5-1 3-2c-1.5-2-3-5-3-9 0-9 7.5-15.5 18.5-15.5z"/>
                <path class="stripe" d="M-6-15q1 5 0 8M0-15.6v7M6-15q-1 5 0 8M-18 2h5M-17.5 5.5h4M18 2h-5M17.5 5.5h-4"/>
                <path class="cream" d="M1 4c-3-2-9-1-9.5 3.5-.4 3.4 3 5.5 6 5 2-.3 3-1.4 3.5-2.4.5 1 1.5 2.1 3.5 2.4 3 .5 6.4-1.6 6-5C10 3 4 2 1 4z"/>
                <g class="eye-open">
                    <ellipse class="sclera ol" cx="-7" cy="-1.5" rx="5" ry="5.8"/><ellipse class="sclera ol" cx="8" cy="-1.5" rx="5" ry="5.8"/>
                    <ellipse class="iris" cx="-6.4" cy="-1.2" rx="4" ry="4.8"/><ellipse class="iris" cx="8.6" cy="-1.2" rx="4" ry="4.8"/>
                    <ellipse class="ink" cx="-6.2" cy="-1" rx="1.9" ry="3.2"/><ellipse class="ink" cx="8.8" cy="-1" rx="1.9" ry="3.2"/>
                    <circle fill="#fff" cx="-4.7" cy="-3.5" r="1.5"/><circle fill="#fff" cx="10.3" cy="-3.5" r="1.5"/>
                    <circle fill="#fff" cx="-7.6" cy=".9" r=".7"/><circle fill="#fff" cx="7.4" cy=".9" r=".7"/>
                </g>
                <path class="eye-happy ink-line" d="M-11-.5q4-5 8 0M4-.5q4-5 8 0"/>
                <path class="eye-sleep ink-line" d="M-11-1.5q4 4 8 0M4-1.5q4 4 8 0"/>
                <g class="blush pink" opacity=".75"><ellipse cx="-12" cy="7" rx="3.2" ry="1.9"/><ellipse cx="14" cy="7" rx="3.2" ry="1.9"/></g>
                <path class="nose ol" d="M-1 4.2h4c0 1.3-1 2.2-2 2.6-1-.4-2-1.3-2-2.6z"/>
                <path class="ink-line" stroke-width="1.1" d="M1 6.8v1.2q-1.6 2.6-3.8 1.2M1 8q1.6 2.6 3.8 1.2"/>
                <path class="whisker" d="M10 6.5l15-2.5M10 8.5l15 1M10 10.5l13 3.5M-8 6.5l-14-2.5M-8 8.5l-14 1M-8 10.5l-12 3.5"/>
            </g>
        </svg>
        </div></div>
    </div>
</div>

{{- $js := resources.Get "js/home-lab.js" | minify | fingerprint }}
<script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" defer></script>
