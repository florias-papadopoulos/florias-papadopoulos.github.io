{{- /* The cat on the home page: markup here (drawing in cat-svg.html), behaviour in assets/js/home-lab.js,
       styles in assets/css/common/cat.css */ -}}
<div class="world-layer" id="world-layer" aria-hidden="true"><svg class="terrain" id="terrain"></svg></div>
<div class="cat-layer" id="cat-layer">
    <div class="cat" id="cat" role="button" tabindex="0" aria-label="A cat. Click to pet it.">
        <div class="cat-tilt"><div class="cat-flip">
        {{ partial "cat-svg.html" . }}
        </div></div>
    </div>
</div>

{{- $js := resources.Get "js/home-lab.js" | minify | fingerprint }}
<script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" defer></script>
